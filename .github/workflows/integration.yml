name: Integration
on:
  push:
    branches:
    - master
    - user/*/trunk
    tags-ignore:
    - "*"
    paths-ignore:
    - .direnv
    - .helix
    - .meta
    - docs
    - "*.md"
    - .codecov.yml
  pull_request:
    branches:
    - master
    - user/*/trunk
    tags-ignore:
    - "*"
    paths-ignore:
    - .direnv
    - .helix
    - .meta
    - docs
    - "*.md"
    - .codecov.yml
permissions:
  actions: read
  contents: read
  security-events: write
defaults:
  run:
    shell: bash
env:
  DEVSHELL: ci
  GRYPE_DB_CACHE_TEMP_PATH: .cache/grype/db/
jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 1
    - name: direnv nix
      uses: JRMurr/direnv-nix-action@fc1182ab8fc636cdcef08176ad91e5c1087658d9 # v4.2.0
      with:
        install-nix: true
        cache-store: true
    - name: cache devshell
      run: nix develop --command true
  integrate:
    runs-on: ubuntu-latest
    needs: [warmup]
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # needed to lint commit history & changelog generation
        fetch-tags: true # needed for version bumping
        persist-credentials: false
    - name: direnv nix
      uses: JRMurr/direnv-nix-action@fc1182ab8fc636cdcef08176ad91e5c1087658d9 # v4.2.0
      with:
        install-nix: true
        cache-store: true
    - name: set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: setup docker buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: cache grype
      uses: pat-s/always-upload-cache@9a0d1c3e1a8260b05500f9b67a5be8f2a1299819 # v3
      with:
        path: ${{ runner.temp }}/${{ env.GRYPE_DB_CACHE_TEMP_PATH }}
        key: ${{ runner.os }}-grype-${{ hashFiles('.grype.yaml') }}
        restore-keys: |
          ${{ runner.os }}-grype-${{ hashFiles('.grype.yaml') }}
          ${{ runner.os }}-grype-
    - name: build
      run: make all
    - name: lint
      run: make sast check
    - name: test
      run: make test
    - name: report test
      run: make coverage-upload
      continue-on-error: true
      if: always()
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: report lint
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
      continue-on-error: true
      if: always()
      with:
        sarif_file: sast.sarif
